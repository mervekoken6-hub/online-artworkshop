<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Art Workshop | Kayıt</title>

<style>
*,
*::before,
*::after{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:radial-gradient(circle at top,#0b1220,#05060a);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 12px;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(12,18,32,.95);
  border-radius:18px;
  padding:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
}

h1{text-align:center;margin:0 0 6px}
.subtitle{text-align:center;font-size:14px;opacity:.8;margin-bottom:16px}

.langbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:18px;
}
.langbtn{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #374151;
  background:#1f2937;
  color:#fff;
  cursor:pointer;
}
.langbtn.active{
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
}

label{font-size:13px;margin:12px 0 6px;display:block}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#fff;
  color:#000;
  font-size:14px;
}

textarea{min-height:80px}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:520px){.row{grid-template-columns:1fr}}

.warn{
  margin-top:16px;
  background:#3a2f12;
  border:1px solid #facc15;
  color:#fde68a;
  border-radius:14px;
  padding:14px;
  text-align:center;
  font-weight:600;
}

/* ✅ Banka kutusu (görseldeki gibi sade bir kart) */
.bankbox{
  margin-top:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;
  padding:14px;
  line-height:1.45;
}
.bankbox .title{
  font-weight:800;
  margin-bottom:6px;
}
.bankbox .line{
  font-weight:600;
  opacity:.95;
}
.bankbox .muted{
  opacity:.85;
  font-weight:600;
}

.btn{
  margin-top:18px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
.btn:disabled{opacity:.6;cursor:not-allowed}

.success{display:none;text-align:center}
.success h2{color:#c4b5fd}
</style>
</head>

<body>

<div class="card" id="formCard">
  <h1 id="t_title">Online Art Workshop</h1>
  <p class="subtitle" id="t_subtitle">Kayıt Formu • Zoom linki WhatsApp’tan gönderilir</p>

  <div class="langbar">
    <button type="button" class="langbtn active" data-lang="tr">🇹🇷 Türkçe</button>
    <button type="button" class="langbtn" data-lang="en">🇬🇧 English</button>
    <button type="button" class="langbtn" data-lang="fa">🇮🇷 فارسی</button>
  </div>

  <form id="registerForm">
    <label id="l_name">Ad Soyad</label>
    <input id="name" name="name" type="text" required>

    <div class="row">
      <div>
        <label id="l_email">E-posta</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div>
        <label id="l_phone">Telefon (WhatsApp)</label>
        <input id="phone" name="phone" type="text" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label id="l_date">Tarih</label>
        <input id="date" name="date" type="date" required>
      </div>
      <div>
        <label id="l_time">Seans Saati</label>
        <select id="timeSlot" name="seans" required>
          <option value="">Saat seçiniz</option>
          <option>09.30 – 11.00</option>
          <option>11.20 – 12.50</option>
          <option>14.10 – 15.40</option>
          <option>16.00 – 17.30</option>
          <option>17.50 – 19.20</option>
        </select>
      </div>
    </div>

    <label id="l_price">Ücret</label>
    <input id="price" name="ucret" type="text" required>

    <label id="l_note">Not</label>
    <textarea id="note" name="not"></textarea>

    <!-- ✅ Banka Havalesi Kutusu (3 dilde içerik JS'den basılacak) -->
    <div class="bankbox" id="bankBox">
      <div class="title" id="t_bank_title">Banka Havalesi Bilgileri</div>
      <div class="line" id="t_bank_receiver">Alıcı: Merve Köken</div>
      <div class="line" id="t_bank_iban">IBAN: TR78 0004 6012 1488 8000 1122 48</div>
      <div class="muted" id="t_bank_desc">Açıklama: Ad Soyad – Atölye Adı</div>
    </div>

    <!-- Uyarı -->
    <div class="warn" id="t_warn"></div>

    <button class="btn" type="submit" id="submitBtn">Kaydı Gönder</button>
  </form>
</div>

<div class="card success" id="successCard">
  <h2 id="t_success">✨ Kayıt Alındı</h2>
  <p id="t_success_text">Teşekkürler! WhatsApp üzerinden dekontu gönderdiğinizde Zoom linki paylaşılacaktır.</p>
</div>

<script>
/* ✅ API URL (SENİN KULLANDIĞIN) */
const API_URL="https://script.google.com/macros/s/AKfycbzTmI7NICLJ9fYiMChA-4jDkh3c9Q75djEU9cE3l3fpldRF3jpPDjWglQHBni7KiRBYjQ/exec";

/* ✅ WhatsApp numarası */
const WHATSAPP_NO = "0530 916 44 25";

/* ✅ Banka bilgileri (bire bir) */
const BANK = {
  receiver: "Merve Köken",
  iban: "TR78 0004 6012 1488 8000 1122 48",
  desc_tr: "Ad Soyad – Atölye Adı",
  desc_en: "Full Name – Workshop Name",
  desc_fa: "نام و نام خانوادگی – نام کارگاه"
};

const dict={
tr:{
  title:"Online Art Workshop",
  subtitle:"Kayıt Formu • Zoom linki WhatsApp’tan gönderilir",
  name:"Ad Soyad", email:"E-posta", phone:"Telefon (WhatsApp)", date:"Tarih", time:"Seans Saati",
  price:"Ücret", note:"Not",

  bankTitle:"Banka Havalesi Bilgileri",
  bankReceiver:`Alıcı: ${BANK.receiver}`,
  bankIban:`IBAN: ${BANK.iban}`,
  bankDesc:`Açıklama: ${BANK.desc_tr}`,

  warn:`⚠️ Ödeme dekontunu WhatsApp üzerinden ${WHATSAPP_NO} gönderiniz.<br>Zoom linki ödeme kontrolünden sonra paylaşılır.`,
  submit:"Kaydı Gönder",
  successTitle:"✨ Kayıt Alındı",
  successText:`Teşekkürler! WhatsApp üzerinden ${WHATSAPP_NO} dekontu gönderdiğinizde Zoom linki paylaşılacaktır.`
},
en:{
  title:"Online Art Workshop",
  subtitle:"Registration Form • Zoom link via WhatsApp",
  name:"Full Name", email:"Email", phone:"Phone (WhatsApp)", date:"Date", time:"Session Time",
  price:"Fee", note:"Note",

  bankTitle:"Bank Transfer Details",
  bankReceiver:`Recipient: ${BANK.receiver}`,
  bankIban:`IBAN: ${BANK.iban}`,
  bankDesc:`Description: ${BANK.desc_en}`,

  warn:`⚠️ Please send the payment receipt via WhatsApp to ${WHATSAPP_NO}.<br>The Zoom link will be shared after verification.`,
  submit:"Submit Registration",
  successTitle:"✨ Registration Received",
  successText:`Thank you! When you send the receipt via WhatsApp to ${WHATSAPP_NO}, the Zoom link will be shared.`
},
fa:{
  title:"کارگاه آنلاین هنر",
  subtitle:"فرم ثبت‌نام • لینک زوم از واتساپ",
  name:"نام و نام خانوادگی", email:"ایمیل", phone:"واتساپ", date:"تاریخ", time:"ساعت جلسه",
  price:"هزینه", note:"یادداشت",

  bankTitle:"اطلاعات حواله بانکی",
  bankReceiver:`گیرنده: ${BANK.receiver}`,
  bankIban:`IBAN: ${BANK.iban}`,
  bankDesc:`توضیحات: ${BANK.desc_fa}`,

  warn:`⚠️ رسید پرداخت را از واتساپ به شماره ${WHATSAPP_NO} ارسال کنید.<br>لینک زوم بعد از بررسی ارسال می‌شود.`,
  submit:"ارسال ثبت‌نام",
  successTitle:"✨ ثبت‌نام انجام شد",
  successText:`متشکریم! پس از ارسال رسید پرداخت از طریق واتساپ به شماره ${WHATSAPP_NO}، لینک زوم ارسال خواهد شد.`
}
};

let currentLang="tr";

function setLang(l){
  currentLang = l;
  document.documentElement.dir=(l==="fa")?"rtl":"ltr";

  t_title.textContent=dict[l].title;
  t_subtitle.textContent=dict[l].subtitle;

  l_name.textContent=dict[l].name;
  l_email.textContent=dict[l].email;
  l_phone.textContent=dict[l].phone;
  l_date.textContent=dict[l].date;
  l_time.textContent=dict[l].time;
  l_price.textContent=dict[l].price;
  l_note.textContent=dict[l].note;

  // ✅ Banka kutusu
  t_bank_title.textContent = dict[l].bankTitle;
  t_bank_receiver.textContent = dict[l].bankReceiver;
  t_bank_iban.textContent = dict[l].bankIban;
  t_bank_desc.textContent = dict[l].bankDesc;

  // ✅ Uyarı + Success metinleri
  t_warn.innerHTML=dict[l].warn;
  submitBtn.textContent=dict[l].submit;

  t_success.textContent=dict[l].successTitle;
  document.getElementById("t_success_text").textContent = dict[l].successText;

  document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
}

document.querySelectorAll(".langbtn").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
setLang("tr");

registerForm.addEventListener("submit", async e=>{
  e.preventDefault();
  submitBtn.disabled=true;

  try{
    const fd = new FormData();
    fd.append("type", "canli");

    fd.append("name", name.value);
    fd.append("email", email.value);
    fd.append("phone", phone.value);
    fd.append("date", date.value);
    fd.append("seans", timeSlot.value);
    fd.append("ucret", price.value);
    fd.append("not", note.value);

    fd.append("dil", currentLang);
    fd.append("durum", "Beklemede");

    await fetch(API_URL, { method:"POST", body: fd });

    formCard.style.display="none";
    successCard.style.display="block";

  }catch(err){
    alert("Hata oluştu. Lütfen tekrar deneyin.");
    submitBtn.disabled=false;
  }
});
</script>

</body>
</html>
