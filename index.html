<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Art Workshop | Kayıt</title>

<style>
*,
*::before,
*::after{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:radial-gradient(circle at top,#0b1220,#05060a);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:40px 12px;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(12,18,32,.95);
  border-radius:18px;
  padding:26px;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
}

h1{text-align:center;margin:0 0 6px}
.subtitle{text-align:center;font-size:14px;opacity:.8;margin-bottom:16px}

.langbar{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:18px;
}
.langbtn{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #374151;
  background:#1f2937;
  color:#fff;
  cursor:pointer;
}
.langbtn.active{
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
}

label{font-size:13px;margin:12px 0 6px;display:block}

input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#fff;
  color:#000;
  font-size:14px;
}

textarea{min-height:80px}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:520px){.row{grid-template-columns:1fr}}

.warn{
  margin-top:16px;
  background:#3a2f12;
  border:1px solid #facc15;
  color:#fde68a;
  border-radius:14px;
  padding:14px;
  text-align:center;
  font-weight:600;
}

.btn{
  margin-top:18px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
.btn:disabled{opacity:.6;cursor:not-allowed}

.success{display:none;text-align:center}
.success h2{color:#c4b5fd}
</style>
</head>

<body>

<div class="card" id="formCard">
  <h1 id="t_title">Online Art Workshop</h1>
  <p class="subtitle" id="t_subtitle">Kayıt Formu • Zoom linki WhatsApp’tan gönderilir</p>

  <div class="langbar">
    <button type="button" class="langbtn active" data-lang="tr">🇹🇷 Türkçe</button>
    <button type="button" class="langbtn" data-lang="en">🇬🇧 English</button>
    <button type="button" class="langbtn" data-lang="fa">🇮🇷 فارسی</button>
  </div>

  <form id="registerForm">
    <label id="l_name">Ad Soyad</label>
    <input id="name" type="text" required>

    <div class="row">
      <div>
        <label id="l_email">E-posta</label>
        <input id="email" type="email" required>
      </div>
      <div>
        <label id="l_phone">Telefon (WhatsApp)</label>
        <input id="phone" type="text" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label id="l_date">Tarih</label>
        <input id="date" type="date" required>
      </div>
      <div>
        <label id="l_time">Seans Saati</label>
        <select id="timeSlot" required>
          <option value="">Saat seçiniz</option>
          <option>09.30 – 11.00</option>
          <option>11.20 – 12.50</option>
          <option>14.10 – 15.40</option>
          <option>16.00 – 17.30</option>
          <option>17.50 – 19.20</option>
        </select>
      </div>
    </div>

    <label id="l_price">Ücret</label>
    <input id="price" type="text" required>

    <label id="l_note">Not</label>
    <textarea id="note"></textarea>

    <div class="warn" id="t_warn">
      ⚠️ Ödeme dekontunu WhatsApp üzerinden gönderiniz.<br>
      Zoom linki ödeme kontrolünden sonra paylaşılır.
    </div>

    <button class="btn" type="submit" id="submitBtn">Kaydı Gönder</button>
  </form>
</div>

<div class="card success" id="successCard">
  <h2 id="t_success">✨ Kayıt Alındı</h2>
  <p>Teşekkürler! WhatsApp üzerinden dekontu gönderdiğinizde Zoom linki paylaşılacaktır.</p>
</div>

<script>
// ✅ EN SON verdiğin URL (bunu istedin)
const API_URL="https://script.google.com/macros/s/AKfycbzTmI7NICLJ9fYiMChA-4jDkh3c9Q75djEU9cE3l3fpldRF3jpPDjWglQHBni7KiRBYjQ/exec";

const dict={
tr:{title:"Online Art Workshop",subtitle:"Kayıt Formu • Zoom linki WhatsApp’tan gönderilir",
name:"Ad Soyad",email:"E-posta",phone:"Telefon (WhatsApp)",date:"Tarih",time:"Seans Saati",
price:"Ücret",note:"Not",warn:"⚠️ Ödeme dekontunu WhatsApp üzerinden gönderiniz.<br>Zoom linki ödeme kontrolünden sonra paylaşılır.",
submit:"Kaydı Gönder",success:"✨ Kayıt Alındı"},
en:{title:"Online Art Workshop",subtitle:"Registration Form • Zoom link via WhatsApp",
name:"Full Name",email:"Email",phone:"Phone (WhatsApp)",date:"Date",time:"Session Time",
price:"Fee",note:"Note",warn:"⚠️ Please send payment receipt via WhatsApp.<br>Zoom link after verification.",
submit:"Submit Registration",success:"✨ Registration Received"},
fa:{title:"کارگاه آنلاین هنر",subtitle:"فرم ثبت‌نام • لینک زوم از واتساپ",
name:"نام و نام خانوادگی",email:"ایمیل",phone:"واتساپ",date:"تاریخ",time:"ساعت جلسه",
price:"هزینه",note:"یادداشت",warn:"⚠️ رسید پرداخت را از واتساپ ارسال کنید.<br>لینک زوم بعد از بررسی ارسال می‌شود.",
submit:"ارسال ثبت‌نام",success:"✨ ثبت‌نام انجام شد"}
};

function setLang(l){
  document.documentElement.dir=(l==="fa")?"rtl":"ltr";
  t_title.textContent=dict[l].title;
  t_subtitle.textContent=dict[l].subtitle;
  l_name.textContent=dict[l].name;
  l_email.textContent=dict[l].email;
  l_phone.textContent=dict[l].phone;
  l_date.textContent=dict[l].date;
  l_time.textContent=dict[l].time;
  l_price.textContent=dict[l].price;
  l_note.textContent=dict[l].note;
  t_warn.innerHTML=dict[l].warn;
  submitBtn.textContent=dict[l].submit;
  t_success.textContent=dict[l].success;
  document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));
}

document.querySelectorAll(".langbtn").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
setLang("tr");

// ✅ "undefined" sorununu kesin bitiren kısım: elementleri güvenli şekilde alıyoruz
const formEl     = document.getElementById("registerForm");
const nameInput  = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const dateInput  = document.getElementById("date");
const timeSelect = document.getElementById("timeSlot");
const priceInput = document.getElementById("price");
const noteInput  = document.getElementById("note");

formEl.addEventListener("submit", async e=>{
  e.preventDefault();
  submitBtn.disabled=true;

  try{
    // ✅ Apps Script ile %100 uyumlu (FormData)
    const fd = new FormData();
    fd.append("type", "canli");
    fd.append("name", (nameInput.value || "").trim());
    fd.append("email", (emailInput.value || "").trim());
    fd.append("phone", (phoneInput.value || "").trim());
    fd.append("date", (dateInput.value || "").trim());
    fd.append("seans", (timeSelect.value || "").trim());
    fd.append("ucret", (priceInput.value || "").trim());
    fd.append("not", (noteInput.value || "").trim());
    fd.append("dil", "tr");
    fd.append("durum", "Beklemede");

    const res = await fetch(API_URL, {
      method: "POST",
      body: fd
    });

    // fetch hata vermezse bile Apps Script bazen HTML döndürebilir.
    // Biz sadece başarılı gönderimde ekranı gösteriyoruz.
    formCard.style.display="none";
    successCard.style.display="block";

  }catch(err){
    alert("Hata oluştu. Lütfen tekrar deneyin.");
    submitBtn.disabled=false;
  }
});
</script>

</body>
</html>
