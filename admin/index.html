<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  vertical-align:top;
}
.hidden{display:none}
.status{margin-left:10px;font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}
</style>
</head>

<body>

<h1>🧙 Admin Panel</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <span style="opacity:.8">API bağlı</span>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
/* =====================
   AYARLAR
===================== */
const PASSWORD = "cadimagic2025";
const API_URL = "https://script.google.com/macros/s/AKfycbx7AiP3yKgNBUtY-25w7wldp_MUd5Q8JGsbRDJ4W8pxDAm13RIgvUrs53itOYchsRwe_Q/exec";

/* =====================
   GİRİŞ
===================== */
function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else{
    err.style.display="block";
  }
}

function logout(){
  location.reload();
}

/* =====================
   VERİ ÇEKME
===================== */
async function loadData(type){
  status.textContent = "⏳ Yükleniyor...";
  status.className = "status";

  try{
    const res = await fetch(API_URL + "?type=" + type);
    const json = await res.json();

    if(!json.ok){
      status.textContent = "❌ API hata";
      status.className = "status bad";
      return;
    }

    renderRows(json.rows || []);
    status.textContent = "✅ Yüklendi (" + json.rows.length + ")";
    status.className = "status ok";

  }catch(e){
    status.textContent = "❌ Bağlantı hatası";
    status.className = "status bad";
  }
}

/* =====================
   TABLOYA YAZ
===================== */
function renderRows(rows){
  const el = document.getElementById("rows");
  el.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.kayitTarihi || ""}</td>
      <td>${r.adSoyad || ""}</td>
      <td>${r.email || ""}</td>
      <td>${r.telefon || ""}</td>
      <td>${r.tarih || ""}</td>
      <td>${r.seans || ""}</td>
      <td>${r.ucret || ""}</td>
      <td>${r.not || ""}</td>
      <td>${r.dil || ""}</td>
      <td>${r.durum || ""}</td>
    `;
    el.appendChild(tr);
  });
}
</script>

</body>
</html>
