<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönetim Paneli • Workshop</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: #334155; padding: 14px; text-align: left; font-size: 11px; text-transform: uppercase; color: #94a3b8; }
        td { padding: 14px; border-bottom: 1px solid #334155; font-size: 13px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; color: white; display: inline-flex; align-items: center; gap: 5px; }
        .btn-nav { background: #6366f1; }
        .btn-pdf { background: #10b981; margin-left: 10px; }
        .btn-approve { background: #22c55e; font-size: 11px; }
        .btn-reject { background: #ef4444; font-size: 11px; }
        .status-Onaylandı { color: #4ade80; font-weight: bold; }
        .status-Reddedildi { color: #f87171; font-weight: bold; }
        .status-Beklemede { color: #fbbf24; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; background: #0f172a; border: 1px solid #334155; }
        .hidden { display: none; }
        .wa-link { color: #22c55e; text-decoration: none; font-size: 20px; font-weight: bold; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    </style>
</head>
<body>

    <div id="login" class="card" style="max-width:350px; margin: 100px auto; text-align:center;">
        <h2 style="color:#a78bfa">Admin Paneli</h2>
        <input type="password" id="pass" placeholder="Giriş Şifresi" style="width:85%; margin-bottom:15px;">
        <button onclick="checkPass()" class="btn btn-nav" style="width:92%;">Giriş Yap</button>
    </div>

    <div id="panel" class="hidden">
        <div class="card" style="display: flex; align-items: center; gap: 10px;">
            <input id="url" placeholder="Apps Script API URL" style="flex-grow: 1;">
            <button onclick="saveURL()" class="btn btn-nav">Bağlantıyı Kaydet</button>
            <button onclick="downloadPDF()" id="pdfBtn" class="btn btn-pdf hidden">📄 PDF Olarak İndir</button>
            <button onclick="location.reload()" class="btn" style="background:#475569">Çıkış</button>
        </div>

        <div style="text-align:center; margin-bottom:20px; display:flex; justify-content:center; gap:10px;">
            <button onclick="fetchData('cadi')" class="btn btn-nav" style="background:#7c3aed; min-width: 160px;">🧙 Cadı Atölyesi</button>
            <button onclick="fetchData('canli')" class="btn btn-nav" style="background:#db2777; min-width: 160px;">🎥 Canlı Ders</button>
        </div>

        <div class="card" style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>Telefon</th>
                        <th>Seans Tarihi</th>
                        <th>Kayıt Tarihi</th>
                        <th>E-Posta</th>
                        <th>Ücret</th>
                        <th>Not</th>
                        <th>Dil</th>
                        <th>Kontenjan</th>
                        <th>Durum</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let curType = "";
        let currentRows = [];

        // Türkçe Karakter Temizleyici (PDF için)
        function trToEn(text) {
            if(!text) return "—";
            return String(text)
                .replace(/Ğ/g, "G").replace(/ğ/g, "g")
                .replace(/Ü/g, "U").replace(/ü/g, "u")
                .replace(/Ş/g, "S").replace(/ş/g, "s")
                .replace(/İ/g, "I").replace(/ı/g, "i")
                .replace(/Ö/g, "O").replace(/ö/g, "o")
                .replace(/Ç/g, "C").replace(/ç/g, "c")
                .replace(/[^\x00-\x7F]/g, ""); // Diğer tüm garip karakterleri siler
        }

        function checkPass() {
            if(document.getElementById('pass').value === "cadimagic2025") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('panel').classList.remove('hidden');
                document.getElementById('url').value = localStorage.getItem('my_api') || "";
            } else {
                Swal.fire({ icon: 'error', title: 'Hata', text: 'Geçersiz şifre!', background: '#1e293b', color: '#fff' });
            }
        }

        function saveURL() { 
            localStorage.setItem('my_api', document.getElementById('url').value.trim()); 
            Swal.fire({ icon: 'success', title: 'Başarılı', text: 'API bağlantısı kaydedildi.', background: '#1e293b', color: '#fff' }); 
        }

        async function update(idx, status) {
            const api = localStorage.getItem('my_api');
            const res = await callAPI(api, { action: "update", type: curType, rowIndex: idx, status: status });
            if(res.ok) {
                fetchData(curType);
            } else if(res.error === "limit") {
                Swal.fire({
                    icon: 'warning',
                    title: 'Kontenjan Dolu!',
                    text: 'Bu seansa zaten 5 kişi onaylanmış.',
                    background: '#1e293b',
                    color: '#fff',
                    confirmButtonColor: '#6366f1'
                });
            }
        }

        async function fetchData(type) {
            curType = type;
            const api = localStorage.getItem('my_api');
            const list = document.getElementById('list');
            list.innerHTML = "<tr><td colspan='11' style='text-align:center; padding:50px;'>Veriler getiriliyor...</td></tr>";
            
            const res = await callAPI(api, { type: type });
            currentRows = res.rows;
            document.getElementById('pdfBtn').classList.remove('hidden');
            list.innerHTML = "";

            const counts = {};
            res.rows.forEach(r => { if(r[9] === "Onaylandı") { const k = String(r[4]).split('T')[0] + "_" + String(r[5]); counts[k] = (counts[k] || 0) + 1; } });

            const raw = [...res.rows];
            raw.reverse().forEach((r, revIdx) => {
                const realIdx = raw.length - 1 - revIdx;
                const dKey = String(r[4]).split('T')[0] + "_" + String(r[5]);
                const c = counts[dKey] || 0;
                const status = r[9] || "Beklemede";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${r[1] || '—'}</b></td>
                    <td>${r[3] || '—'}</td>
                    <td>${String(r[4]).split('T')[0]}<br><small>${r[5] || '—'}</small></td>
                    <td><small>${r[0] ? new Date(r[0]).toLocaleString('tr-TR') : '—'}</small></td>
                    <td>${r[2] || '—'}</td>
                    <td>${r[6] || '0'} TL</td>
                    <td title="${r[7]}">${r[7] ? r[7].substring(0,15)+'...' : '—'}</td>
                    <td><span class="badge">${r[8] || 'tr'}</span></td>
                    <td><span class="badge" style="border-color:${c >= 5 ? '#ef4444' : '#10b981'}">${c} / 5</span></td>
                    <td class="status-${status.replace(/\s/g,'')}">${status}</td>
                    <td style="display:flex; gap:8px;">
                        <button class="btn btn-approve" onclick="update(${realIdx}, 'Onaylandı')">Onayla</button>
                        <button class="btn btn-reject" onclick="update(${realIdx}, 'Reddedildi')">Reddet</button>
                        <a href="https://wa.me/${String(r[3]).replace(/\D/g,'')}" target="_blank" class="wa-link">📲</a>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            
            doc.setFont("helvetica", "bold");
            doc.text(trToEn(curType.toUpperCase() + " KAYIT LISTESI"), 14, 15);
            
            // Verileri PDF için temizle (Sembolleri engelle)
            const tableData = currentRows.map(r => [
                trToEn(r[1]), 
                r[3] || "—", 
                String(r[4]).split('T')[0], 
                trToEn(r[5]), 
                r[2] || "—", 
                r[6] || "0", 
                trToEn(r[9] || "Beklemede")
            ]);

            doc.autoTable({
                head: [['Ad Soyad', 'Telefon', 'Tarih', 'Seans', 'E-posta', 'Ucret', 'Durum']],
                body: tableData,
                startY: 22,
                theme: 'grid',
                headStyles: { fillColor: [99, 102, 241] },
                styles: { font: "helvetica", fontSize: 9 }
            });
            
            doc.save(curType + "_liste.pdf");
        }

        function callAPI(url, params) {
            return new Promise(resolve => {
                const cb = "cb" + Math.floor(Math.random()*1000000);
                const s = document.createElement('script');
                const q = new URLSearchParams(params).toString();
                window[cb] = d => { s.remove(); resolve(d); };
                s.src = `${url}?${q}&callback=${cb}`;
                document.body.appendChild(s);
            });
        }
    </script>
</body>
</html>
