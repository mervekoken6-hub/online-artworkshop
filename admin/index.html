<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
  body{
    margin:0;
    font-family:system-ui, -apple-system, sans-serif;
    background:#0b1220;
    color:#fff;
    padding:30px;
  }
  .card{
    background:#111827;
    padding:20px;
    border-radius:14px;
    max-width:1200px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  h1{ margin-top: 0; font-size: 24px; }
  button{
    padding:10px 18px;
    border-radius:8px;
    border:none;
    background:#6366f1;
    color:#fff;
    cursor:pointer;
    margin-right:8px;
    font-weight: 600;
    transition: background 0.2s;
  }
  button:hover{ background:#4f46e5; }
  button.secondary { background: #374151; }
  
  input{
    padding:10px;
    border-radius:8px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #fff;
    width:400px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
  }
  th{
    text-align: left;
    background: #1f2937;
    color: #9ca3af;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  th,td{
    padding:12px 15px;
    border-bottom:1px solid #1f2937;
    vertical-align:middle;
  }
  tr:hover { background: rgba(255,255,255,0.02); }
  .status-badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    background: #374151;
  }
  .hidden{display:none}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <input type="password" id="password" placeholder="Yönetici Şifresi">
  <button onclick="login()">Giriş Yap</button>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:20px; border-bottom: 1px solid #374151; padding-bottom: 20px;">
    <input id="apiUrl" placeholder="Apps Script /exec URL">
    <button onclick="saveApi()">API Kaydet</button>
    <button class="secondary" onclick="logout()">Güvenli Çıkış</button>
  </div>

  <div style="margin-bottom: 10px;">
    <strong style="margin-right: 15px; color: #9ca3af;">Atölye Seçimi:</strong>
    <button onclick="loadData('cadi')" style="background: #7c3aed;">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')" style="background: #ec4899;">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="10" style="text-align:center; color:#6b7280;">Lütfen bir atölye seçin...</td></tr>
    </tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";
const rowsEl = document.getElementById("rows");

/* -------- Giriş/Çıkış Mekanizması -------- */
function login(){
  const pwInput = document.getElementById("password");
  if(pwInput.value === PASSWORD){
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("panelCard").classList.remove("hidden");
    apiUrl.value = localStorage.getItem(LS_API) || "";
  } else {
    alert("Şifre yanlış!");
  }
}

function logout(){ location.reload(); }

function saveApi(){
  const v = apiUrl.value.trim();
  localStorage.setItem(LS_API, v);
  alert("API URL başarıyla kaydedildi.");
}

/* -------- Veri İşleme -------- */
function renderRows(json){
  rowsEl.innerHTML = "";
  const list = json.rows || [];

  if(list.length === 0){
    rowsEl.innerHTML = '<tr><td colspan="10" style="text-align:center;">Kayıt bulunamadı.</td></tr>';
    return;
  }

  list.forEach(r => {
    const tr = document.createElement("tr");
    
    // Tablo sütunlarını oluştur
    const cols = [
      r.createdAt || "—",
      r.name || "—",
      r.email || "—",
      r.phone || "—",
      r.date || "—",
      r.session || "—",
      (r.price || "0") + " TL",
      r.note || "—",
      r.lang || "tr",
      `<span class="status-badge">${r.status || "Beklemede"}</span>`
    ];

    cols.forEach((c, index) => {
      const td = document.createElement("td");
      if (index === 9) td.innerHTML = c; // Durum badge'i için HTML kullan
      else td.textContent = c;
      tr.appendChild(td);
    });

    rowsEl.appendChild(tr);
  });
}

/* -------- API Bağlantısı (JSONP) -------- */
function loadJSONP(baseUrl, params){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.floor(Math.random()*1000000);
    const urlObj = new URL(baseUrl);

    Object.keys(params).forEach(k => urlObj.searchParams.set(k, params[k]));
    urlObj.searchParams.set("callback", cb);

    const script = document.createElement("script");
    script.src = urlObj.toString();

    window[cb] = (data) => {
      script.remove();
      delete window[cb];
      resolve(data);
    };

    script.onerror = () => {
      script.remove();
      delete window[cb];
      reject(new Error("Bağlantı kurulamadı."));
    };

    document.body.appendChild(script);
  });
}

async function loadData(type){
  const url = localStorage.getItem(LS_API);
  if(!url) return alert("Önce API URL'sini kaydetmelisiniz!");

  rowsEl.innerHTML = '<tr><td colspan="10" style="text-align:center;">Veriler yükleniyor...</td></tr>';

  try {
    const json = await loadJSONP(url, { type: type });
    if(json.ok){
      renderRows(json);
    } else {
      alert("Hata: " + json.error);
    }
  } catch (e) {
    alert("Veri alınamadı. API URL hatalı olabilir veya Apps Script yayını (Deployment) 'Herkes' olarak ayarlanmamış olabilir.");
    rowsEl.innerHTML = '<tr><td colspan="10" style="text-align:center; color:red;">Yükleme başarısız.</td></tr>';
  }
}

// Sayfa açıldığında URL'yi hazırla
window.onload = () => {
  if(localStorage.getItem(LS_API)) {
    document.getElementById("apiUrl").value = localStorage.getItem(LS_API);
  }
};
</script>

</body>
</html>
