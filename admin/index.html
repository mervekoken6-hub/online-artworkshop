<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1100px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
}
.hidden{display:none}
.status{margin-left:10px;font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script WEB APP URL (…/exec)">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD="cadimagic2025";
const LS_API="admin_api_url";

function login(){
  if(password.value===PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else{
    err.style.display="block";
  }
}

function logout(){ location.reload(); }

function saveApi(){
  localStorage.setItem(LS_API, apiUrl.value.trim());
  status.textContent="✅ API kaydedildi";
  status.className="status ok";
}

function fmt(v){
  if(v instanceof Date){
    return v.toLocaleString("tr-TR");
  }
  if(typeof v==="string"){
    const d=new Date(v);
    if(!isNaN(d)) return d.toLocaleString("tr-TR");
  }
  return v ?? "";
}

async function loadData(type){
  const url=localStorage.getItem(LS_API);
  if(!url){
    status.textContent="❌ API URL girilmedi";
    status.className="status bad";
    return;
  }

  status.textContent="⏳ Yükleniyor...";
  status.className="status";

  try{
    const r=await fetch(url+"?type="+encodeURIComponent(type));
    const data=await r.json();

    const rows = Array.isArray(data)
      ? data
      : (data.rows || []);

    renderRows(rows);
    status.textContent="✅ Yüklendi ("+rows.length+")";
    status.className="status ok";
  }catch{
    status.textContent="❌ API okunamadı";
    status.className="status bad";
  }
}

function renderRows(rows){
  const el=document.getElementById("rows");
  el.innerHTML="";

  rows.forEach(r=>{
    if(!Array.isArray(r)) return;

    const tr=document.createElement("tr");
    for(let i=0;i<10;i++){
      const td=document.createElement("td");
      td.textContent=fmt(r[i]);
      tr.appendChild(td);
    }
    el.appendChild(tr);
  });
}

// localStorage'dan URL yükle
apiUrl.value = localStorage.getItem(LS_API) || "";
</script>

</body>
</html>
