<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  vertical-align:top;
}
.hidden{display:none}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş</button>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:12px">
    <input id="apiUrl" placeholder="Apps Script /exec URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
  </div>

  <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
  <button onclick="loadData('canli')">🎥 Canlı Ders</button>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";
const rowsEl = document.getElementById("rows");

/* -------- helpers -------- */
function pick(row, keysOrIndexes){
  for(const k of keysOrIndexes){
    const v = row?.[k];
    if(v !== undefined && v !== null && v !== "") return v;
  }
  return "—";
}

function fmtDate(v){
  if(!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString("tr-TR");
}

function normalizeExecUrl(u){
  const url = String(u || "").trim();
  if(!url) return "";
  // yanlışlıkla /exec dışında bir şey yapıştırılırsa bile kırmayalım
  return url.replace(/\s+/g,"");
}

/* -------- auth -------- */
function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
  } else {
    alert("Şifre yanlış");
  }
}
function logout(){ location.reload(); }
function saveApi(){
  const v = normalizeExecUrl(apiUrl.value);
  localStorage.setItem(LS_API, v);
  apiUrl.value = v;
  alert("API kaydedildi");
}

/* -------- render -------- */
function renderRows(json){
  rowsEl.innerHTML = "";

  const list = json?.rows || json?.data || json?.items || json?.records || [];
  if(!Array.isArray(list) || list.length === 0){
    // boşsa tabloyu boş bırak (istersen uyarı ekleyebilirsin)
    return;
  }

  list.forEach(r=>{
    const tr = document.createElement("tr");

    // ✅ 2 formatı da destekle:
    // 1) r bir obje ise: r.createdAt, r.name...
    // 2) r bir dizi ise: r[0], r[1]...
    let cols;

    if(Array.isArray(r)){
      cols = [
        fmtDate(r[0]),                 // kayıt tarihi
        pick(r,[1]),                   // ad soyad
        pick(r,[2]),                   // email
        pick(r,[3]),                   // telefon
        pick(r,[4]),                   // tarih
        pick(r,[5]),                   // seans
        pick(r,[6]),                   // ücret
        pick(r,[7]),                   // not
        pick(r,[8]),                   // dil
        pick(r,[9])                    // durum
      ];
    } else {
      cols = [
        fmtDate(pick(r,["createdAt","created_at","created"])),
        pick(r,["name","ad","fullname"]),
        pick(r,["email","mail"]),
        pick(r,["phone","telefon","whatsapp"]),
        pick(r,["date","tarih"]),
        pick(r,["session","seans"]),
        pick(r,["price","ucret","fee"]),
        pick(r,["note","not"]),
        pick(r,["lang","dil"]),
        pick(r,["status","durum"])
      ];
    }

    cols.forEach(c=>{
      const td = document.createElement("td");
      td.textContent = c;
      tr.appendChild(td);
    });

    rowsEl.appendChild(tr);
  });
}

/* -------- data -------- */
/*
  ✅ CORS derdi çıkmasın diye JSONP kullanıyoruz:
  Apps Script GET şu şekilde yanıt vermeli:
  callbackName({...json...});
*/
function loadJSONP(baseUrl, params){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*9999);
    const urlObj = new URL(baseUrl);

    Object.keys(params || {}).forEach(k => urlObj.searchParams.set(k, params[k]));
    urlObj.searchParams.set("callback", cb);

    const script = document.createElement("script");
    script.src = urlObj.toString();

    window[cb] = (data) => {
      try { delete window[cb]; } catch {}
      script.remove();
      resolve(data);
    };

    script.onerror = () => {
      try { delete window[cb]; } catch {}
      script.remove();
      reject(new Error("JSONP yüklenemedi"));
    };

    document.body.appendChild(script);
  });
}

async function loadData(type){
  const url = normalizeExecUrl(localStorage.getItem(LS_API));
  if(!url) return alert("API URL girilmedi");
  apiUrl.value = url;

  try {
    // ✅ Önce JSONP (en sağlam)
    const json = await loadJSONP(url, { type });
    renderRows(json);
  } catch (e) {
    // JSONP olmazsa fallback: fetch (bazı ortamlarda çalışabiliyor)
    try {
      const res = await fetch(url + "?type=" + encodeURIComponent(type));
      const json = await res.json();
      renderRows(json);
    } catch (err) {
      console.log(err);
      alert("Veri alınamadı. API URL veya izin/CORS sorunu olabilir.");
    }
  }
}

/* -------- init -------- */
apiUrl.value = localStorage.getItem(LS_API) || "";
</script>

</body>
</html>
