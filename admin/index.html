<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1100px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
}
.hidden{display:none}
.status{margin-left:10px}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script API URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi Kayıtları</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders Kayıtları</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";

function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
  }else{
    err.style.display="block";
  }
}

function logout(){
  location.reload();
}

function saveApi(){
  localStorage.setItem("api", apiUrl.value.trim());
  status.textContent="API kaydedildi";
}

async function loadData(type){
  const url = localStorage.getItem("api");
  if(!url){
    alert("API URL girilmedi");
    return;
  }

  status.textContent="Yükleniyor...";

  try{
    const res = await fetch(url + "?type=" + type);
    const json = await res.json();
    renderRows(json.rows || []);
    status.textContent="Yüklendi";
  }catch{
    status.textContent="API hatası";
  }
}

/* 🔴 SADECE BURASI DÜZELTİLDİ */
function renderRows(rows){
  const el = document.getElementById("rows");
  el.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");

    const mapped = [
      r[0] || "", // Kayıt Tarihi
      r[1] || "", // Ad Soyad
      r[2] || "", // E-posta
      r[3] || "", // Telefon
      r[4] || "", // Tarih
      r[5] || "", // Seans
      r[6] || "", // Ücret
      r[7] || "", // Not
      r[8] || "", // Dil
      r[9] || ""  // Durum
    ];

    mapped.forEach(val => {
      const td = document.createElement("td");
      td.textContent = val;
      tr.appendChild(td);
    });

    el.appendChild(tr);
  });
}

apiUrl.value = localStorage.getItem("api") || "";
</script>

</body>
</html>
