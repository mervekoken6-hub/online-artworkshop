<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  margin-right:6px;
  font-weight:600;
}
.btn-green{background:#22c55e;color:#000}
.btn-yellow{background:#facc15;color:#000}
.btn-red{background:#ef4444;color:#fff}
.btn-main{background:#6366f1;color:#fff}
.btn-wa{background:#25d366;color:#000}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  vertical-align:top;
}
.hidden{display:none}
.status{margin-left:10px; font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}
.actions button{margin-bottom:4px}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button class="btn-main" onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script WEB APP URL (…/exec)">
    <button class="btn-main" onclick="saveApi()">Kaydet</button>
    <button class="btn-red" onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button class="btn-main" onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button class="btn-main" onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
        <th>İşlemler</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD="cadimagic2025";
const LS_API="admin_api_url";

const COL={
  tarihKayit:0,
  adSoyad:1,
  email:2,
  telefon:3,
  tarih:4,
  seans:5,
  ucret:6,
  not:7,
  dil:8,
  durum:9
};

function login(){
  if(password.value===PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else err.style.display="block";
}

function logout(){location.reload();}
function saveApi(){
  localStorage.setItem(LS_API,apiUrl.value.trim());
  status.textContent="✅ API kaydedildi";
  status.className="status ok";
}

function fmt(v){
  if(!v) return "";
  if(typeof v==="string" && v.includes("T")){
    const d=new Date(v);
    if(!isNaN(d)) return d.toLocaleString("tr-TR");
  }
  return String(v);
}

async function loadData(type){
  const url=localStorage.getItem(LS_API);
  if(!url){
    status.textContent="❌ API URL yok";
    status.className="status bad"; return;
  }

  status.textContent="⏳ Yükleniyor...";
  try{
    const r=await fetch(url+"?type="+type);
    const j=await r.json();
    if(!j.ok) throw j.error;
    renderRows(j.rows||[]);
    status.textContent="✅ "+j.rows.length+" kayıt";
    status.className="status ok";
  }catch(e){
    status.textContent="❌ Veri alınamadı";
    status.className="status bad";
  }
}

function renderRows(rows){
  const el=document.getElementById("rows");
  el.innerHTML="";
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    for(let i=0;i<10;i++){
      const td=document.createElement("td");
      td.textContent=fmt(r[i]);
      tr.appendChild(td);
    }

    const td=document.createElement("td");
    td.className="actions";

    td.innerHTML=`
      <button class="btn-green" onclick="alert('Backend’de bağlanabilir')">●</button>
      <button class="btn-yellow" onclick="alert('Backend’de bağlanabilir')">●</button>
      <button class="btn-red" onclick="alert('Backend’de bağlanabilir')">●</button><br>
      <button class="btn-wa" onclick="wa('${r[COL.telefon]}','${r[COL.adSoyad]}')">WhatsApp</button>
    `;
    tr.appendChild(td);
    el.appendChild(tr);
  });
}

function wa(tel,ad){
  if(!tel) return alert("Telefon yok");
  const msg=`Merhaba ${ad||""} 🌙 Cadı Atölyesi kaydınız alınmıştır. Ödeme kontrolünden sonra bilgilendirileceksiniz.`;
  window.open("https://wa.me/9"+tel.replace(/\D/g,"")+"?text="+encodeURIComponent(msg));
}

apiUrl.value=localStorage.getItem(LS_API)||"";
</script>

</body>
</html>
