<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #2a2a2a;
  vertical-align:top;
}
th{
  text-align:left;
  font-size:14px;
  opacity:.85;
}
td{
  font-size:14px;
}
.hidden{display:none}
</style>
</head>

<body>

<h1>🧙 Admin Panel</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password"
         placeholder="Şifre"
         style="padding:10px;border-radius:8px;border:none;width:300px">
  <br><br>
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <strong>API bağlı</strong>
    <button onclick="logout()">Çıkış</button>
  </div>

  <div style="margin-bottom:12px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";

/* 🔴 SABİT API */
const API_URL = "https://script.google.com/macros/s/AKfycbx7AiP3yKgNBUtY-25w7wldp_MUd5Q8JGsbRDJ4W8pxDAm13RIgvUrs53itOYchsRwe_Q/exec";

function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else{
    err.style.display="block";
  }
}

function logout(){
  location.reload();
}

function niceDate(v){
  if(!v) return "";
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString("tr-TR");
}

async function loadData(type){
  try{
    const res = await fetch(API_URL + "?type=" + encodeURIComponent(type));
    const json = await res.json();

    if(!json.ok){
      alert("Veri alınamadı");
      renderRows([]);
      return;
    }

    renderRows(json.rows || []);
  }catch(e){
    alert("API erişim hatası");
  }
}

function renderRows(rows){
  const el = document.getElementById("rows");
  el.innerHTML = "";

  rows.forEach(r=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${niceDate(r[0])}</td>
      <td>${r[1] || ""}</td>
      <td>${r[2] || ""}</td>
      <td>${r[3] || ""}</td>
      <td>${niceDate(r[4])}</td>
      <td>${r[5] || ""}</td>
      <td>${r[6] || ""}</td>
      <td>${r[7] || ""}</td>
      <td>${r[8] || ""}</td>
      <td>${r[9] || ""}</td>
    `;

    el.appendChild(tr);
  });
}
</script>

</body>
</html>
