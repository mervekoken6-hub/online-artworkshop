<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönetim Paneli</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #334155; padding: 12px; text-align: left; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 12px; font-weight: bold; margin: 2px; }
        .btn-check { background: #22c55e; color: white; }
        .btn-x { background: #ef4444; color: white; }
        .btn-nav { background: #6366f1; color: white; padding: 12px 20px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-onay { color: #4ade80; }
        .status-ret { color: #f87171; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login" class="card" style="max-width:400px; margin:auto; text-align:center;">
        <h2>Giriş Yap</h2>
        <input type="password" id="pass" style="padding:10px; width:80%; margin-bottom:10px;">
        <button onclick="checkPass()" class="btn-nav">Giriş</button>
    </div>

    <div id="panel" class="hidden">
        <div class="card">
            <input id="url" placeholder="Apps Script URL" style="width:70%; padding:10px;">
            <button onclick="saveURL()" class="btn-nav" style="padding:10px;">API Kaydet</button>
        </div>

        <div style="text-align:center; margin-bottom:20px;">
            <button onclick="fetchData('cadi')" class="btn-nav">🧙 Cadı Atölyesi</button>
            <button onclick="fetchData('canli')" class="btn-nav" style="background:#ec4899;">🎥 Canlı Ders</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>AD SOYAD</th>
                        <th>TELEFON</th>
                        <th>TARİH / SEANS</th>
                        <th>KONTENJAN</th>
                        <th>DURUM</th>
                        <th>İŞLEMLER</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let curType = "";
        function checkPass() {
            if(document.getElementById('pass').value === "cadimagic2025") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('panel').classList.remove('hidden');
                document.getElementById('url').value = localStorage.getItem('my_api') || "";
            }
        }
        function saveURL() {
            localStorage.setItem('my_api', document.getElementById('url').value);
            alert("Kaydedildi!");
        }

        async function update(id, status) {
            const api = localStorage.getItem('my_api');
            await callAPI(api, { action: "update", type: curType, id: id, status: status });
            fetchData(curType);
        }

        async function fetchData(type) {
            curType = type;
            const api = localStorage.getItem('my_api');
            const list = document.getElementById('list');
            list.innerHTML = "Yükleniyor...";
            
            const res = await callAPI(api, { type: type });
            list.innerHTML = "";

            // Kontenjan hesabı
            const counts = {};
            res.rows.forEach(r => {
                if(r[9] === "Onaylandı") {
                    const k = r[4] + r[5];
                    counts[k] = (counts[k] || 0) + 1;
                }
            });

            res.rows.reverse().forEach((r, i) => {
                const idx = res.rows.length - 1 - i;
                const c = counts[r[4] + r[5]] || 0;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${r[1]}</b></td>
                    <td>${r[3]}</td>
                    <td>${r[4]}<br><small>${r[5]}</small></td>
                    <td><span class="badge" style="background:#334155">${c} / 5</span></td>
                    <td class="${r[9]=='Onaylandı'?'status-onay':(r[9]=='Reddedildi'?'status-ret':'')}">${r[9]||'Beklemede'}</td>
                    <td>
                        <button class="btn-check" onclick="update(${idx}, 'Onaylandı')">✓ Onay</button>
                        <button class="btn-x" onclick="update(${idx}, 'Reddedildi')">✕ Red</button>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function callAPI(url, params) {
            return new Promise(resolve => {
                const cb = "cb" + Date.now();
                const s = document.createElement('script');
                const q = new URLSearchParams(params).toString();
                window[cb] = d => { s.remove(); resolve(d); };
                s.src = `${url}?${q}&callback=${cb}`;
                document.body.appendChild(s);
            });
        }
    </script>
</body>
</html>
