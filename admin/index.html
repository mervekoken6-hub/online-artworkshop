<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim Paneli • Art Workshop</title>
<style>
  body{ margin:0; font-family:system-ui, -apple-system, sans-serif; background:#0b1220; color:#fff; padding:20px; }
  .card{ background:#111827; padding:20px; border-radius:14px; max-width:1300px; margin: 0 auto 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
  h1{ margin: 0 0 20px 0; font-size: 24px; text-align: center; color: #a78bfa; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
  button{ padding:10px 18px; border-radius:8px; border:none; background:#6366f1; color:#fff; cursor:pointer; font-weight: 600; transition: all 0.2s; }
  button:hover{ opacity: 0.9; transform: translateY(-1px); }
  button.secondary { background: #374151; }
  input{ padding:10px; border-radius:8px; border: 1px solid #374151; background: #1f2937; color: #fff; flex-grow: 1; }
  .table-container { overflow-x: auto; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; font-size: 13px; }
  th{ text-align: left; background: #1f2937; color: #9ca3af; padding: 12px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
  td{ padding:12px; border-bottom:1px solid #1f2937; }
  tr:hover { background: rgba(255,255,255,0.03); }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
  .bg-wait { background: #92400e; color: #fef3c7; }
  .bg-full { background: #991b1b; color: #fee2e2; }
  .bg-count { background: #1e40af; color: #dbeafe; }
  .wa-btn { background: #16a34a; color: white; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; display: inline-block; }
  .hidden{display:none}
</style>
</head>
<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
    <input type="password" id="password" placeholder="Yönetici Şifresi">
    <button onclick="login()">Giriş Yap</button>
  </div>
</div>

<div class="card hidden" id="panelCard">
  <div class="controls">
    <input id="apiUrl" placeholder="Google Apps Script URL'nizi buraya yapıştırın">
    <button onclick="saveApi()">API Kaydet</button>
    <button class="secondary" onclick="logout()">Güvenli Çıkış</button>
  </div>

  <div class="controls" style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px;">
    <button onclick="loadData('cadi')" style="background: #7c3aed;">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')" style="background: #ec4899;">🎥 Canlı Ders</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Kayıt Tarihi</th>
          <th>Ad Soyad</th>
          <th>E-posta</th>
          <th>Telefon</th>
          <th>Atölye Tarihi</th>
          <th>Seans</th>
          <th>Kontenjan</th>
          <th>Ücret</th>
          <th>Not</th>
          <th>Dil</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="11" style="text-align:center; color:#6b7280; padding: 40px;">Lütfen bir atölye seçin.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";
const rowsEl = document.getElementById("rows");

function login(){
  if(document.getElementById("password").value === PASSWORD){
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("panelCard").classList.remove("hidden");
    document.getElementById("apiUrl").value = localStorage.getItem(LS_API) || "";
  } else { alert("Şifre yanlış!"); }
}

function logout(){ location.reload(); }
function saveApi(){ localStorage.setItem(LS_API, document.getElementById("apiUrl").value.trim()); alert("API URL kaydedildi."); }

function renderRows(json) {
  rowsEl.innerHTML = "";
  const rawData = json.rows || [];
  if(rawData.length === 0){ rowsEl.innerHTML = '<tr><td colspan="11" style="text-align:center;">Kayıt yok.</td></tr>'; return; }

  const stats = {};
  rawData.forEach(r => {
    const key = (r[4] ? String(r[4]).split('T')[0] : '') + "|" + r[5];
    stats[key] = (stats[key] || 0) + 1;
  });

  rawData.reverse().forEach(r => {
    const tr = document.createElement("tr");
    const dateKey = (r[4] ? String(r[4]).split('T')[0] : '') + "|" + r[5];
    const count = stats[dateKey] || 0;
    
    // Telefon temizleme
    const phone = r[3] ? String(r[3]).replace(/\D/g,'') : '';

    tr.innerHTML = `
      <td>${r[0] ? new Date(r[0]).toLocaleString('tr-TR') : '—'}</td>
      <td style="font-weight:600">${r[1] || '—'}</td>
      <td>${r[2] || '—'}</td>
      <td>${r[3] || '—'}</td>
      <td>${r[4] ? new Date(r[4]).toLocaleDateString('tr-TR') : '—'}</td>
      <td>${r[5] || '—'}</td>
      <td><span class="badge ${count >= 5 ? 'bg-full' : 'bg-count'}">${count} / 5</span></td>
      <td>${r[6] || '0'} TL</td>
      <td title="${r[7]}">${r[7] || '—'}</td>
      <td><span class="badge secondary">${r[8] || 'tr'}</span></td>
      <td><a href="https://wa.me/${phone}" target="_blank" class="wa-btn">WhatsApp</a></td>
    `;
    rowsEl.appendChild(tr);
  });
}

function loadJSONP(baseUrl, params){
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.round(Math.random()*1000000);
    const url = new URL(baseUrl);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    url.searchParams.set("callback", cb);
    const script = document.createElement("script");
    script.src = url.toString();
    window[cb] = (data) => { script.remove(); delete window[cb]; resolve(data); };
    script.onerror = () => { script.remove(); reject(); };
    document.body.appendChild(script);
  });
}

async function loadData(type){
  const url = localStorage.getItem(LS_API);
  if(!url) return alert("API URL eksik!");
  rowsEl.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:40px;">Yükleniyor...</td></tr>';
  try {
    const json = await loadJSONP(url, { type: type });
    if(json.ok) renderRows(json); else alert("Hata: " + json.error);
  } catch (e) { alert("Bağlantı Hatası!"); }
}
</script>
</body>
</html>
