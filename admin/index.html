<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
}
.hidden{display:none}
.status{margin-left:10px;font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script WEB APP URL (…/exec)">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD="cadimagic2025";
const LS_API="admin_api_url";
let currentType="cadi";

function login(){
  if(password.value===PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
  }else err.style.display="block";
}

function logout(){ location.reload(); }

function saveApi(){
  localStorage.setItem(LS_API, apiUrl.value.trim());
  status.textContent="✅ API kaydedildi";
  status.className="status ok";
}

function fmt(v){
  if(!v) return "";
  const d=new Date(v);
  return isNaN(d)?v:d.toLocaleString("tr-TR");
}

async function loadData(type){
  currentType=type;
  const url=localStorage.getItem(LS_API);
  if(!url){
    status.textContent="❌ API URL girilmedi";
    status.className="status bad";
    return;
  }

  const r=await fetch(url+"?type="+type);
  const d=await r.json();
  render(d.rows||[]);
}

function render(rows){
  const thead=document.getElementById("thead");
  const tbody=document.getElementById("rows");
  thead.innerHTML="";
  tbody.innerHTML="";

  if(currentType==="cadi"){
    thead.innerHTML=`
      <tr>
        <th>Kayıt</th><th>Ad Soyad</th><th>E-posta</th><th>Telefon</th>
        <th>Tarih</th><th>Seans</th><th>Ücret</th><th>Not</th><th>Dil</th><th>Durum</th>
      </tr>`;
    rows.slice(1).forEach(r=>{
      tbody.innerHTML+=`
        <tr>
          <td>${fmt(r[0])}</td>
          <td>${r[1]||""}</td>
          <td>${r[2]||""}</td>
          <td>${r[3]||""}</td>
          <td>${fmt(r[4])}</td>
          <td>${r[5]||""}</td>
          <td>${r[6]||""}</td>
          <td>${r[7]||""}</td>
          <td>${r[8]||""}</td>
          <td>${r[9]||""}</td>
        </tr>`;
    });
  }else{
    thead.innerHTML=`
      <tr>
        <th>Kayıt</th><th>E-posta</th><th>Seans</th><th>Dil</th><th>Durum</th>
      </tr>`;
    rows.slice(1).forEach(r=>{
      tbody.innerHTML+=`
        <tr>
          <td>${fmt(r[0])}</td>
          <td>${r[1]||""}</td>
          <td>${r[2]||""}</td>
          <td>${r[3]||""}</td>
          <td>${r[4]||""}</td>
        </tr>`;
    });
  }
}

apiUrl.value=localStorage.getItem(LS_API)||"";
</script>

</body>
</html>
