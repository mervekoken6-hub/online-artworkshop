<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:8px 12px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  vertical-align:top;
}
.hidden{display:none}
.status{margin-left:10px; font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  display:inline-block;
  cursor:pointer;
  margin-right:6px;
}
.green{background:#22c55e}
.yellow{background:#eab308}
.red{background:#ef4444}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script WEB APP URL (…/exec)">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";

function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else{
    err.style.display="block";
  }
}

function logout(){ location.reload(); }

function saveApi(){
  localStorage.setItem(LS_API, apiUrl.value.trim());
  status.textContent="✅ API kaydedildi";
  status.className="status ok";
}

function fmt(v){
  return (v === null || v === undefined) ? "" : String(v);
}

async function loadData(type){
  const url = localStorage.getItem(LS_API);
  if(!url){
    status.textContent="❌ API URL girilmedi";
    status.className="status bad";
    return;
  }

  status.textContent="⏳ Yükleniyor...";
  status.className="status";

  try{
    const res = await fetch(url + "?type=" + type);
    const json = await res.json();

    if(!json.ok){
      status.textContent="❌ API hata";
      status.className="status bad";
      return;
    }

    renderRows(json.rows || []);
    status.textContent="✅ Yüklendi (" + json.rows.length + ")";
    status.className="status ok";

  }catch{
    status.textContent="❌ API bağlantı hatası";
    status.className="status bad";
  }
}

function renderRows(rows){
  const el=document.getElementById("rows");
  el.innerHTML="";

  rows.forEach(r=>{
    const tr=document.createElement("tr");

    const cols = [
      r[0], // kayıt tarihi
      r[1], // ad soyad
      r[2], // email
      r[3], // telefon
      r[4], // tarih
      r[5], // seans
      r[6], // ücret
      r[7], // not
      r[8], // dil
      r[9]  // durum
    ];

    cols.forEach(c=>{
      const td=document.createElement("td");
      td.textContent = fmt(c);
      tr.appendChild(td);
    });

    const action=document.createElement("td");
    action.innerHTML = `
      <span class="dot green" title="Onaylandı"></span>
      <span class="dot yellow" title="Beklemede"></span>
      <span class="dot red" title="İptal"></span>
    `;
    action.onclick = ()=>alert("Durum güncelleme backend’e bağlanabilir.");
    tr.appendChild(action);

    el.appendChild(tr);
  });
}

apiUrl.value = localStorage.getItem(LS_API) || "";
</script>

</body>
</html>
