<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Cadı Sanat Atölyesi</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #2a2a2a;
}
.hidden{display:none}
.dot{
  width:14px;height:14px;border-radius:50%;display:inline-block;
}
.green{background:#22c55e}
.yellow{background:#facc15}
.red{background:#ef4444}
</style>
</head>

<body>

<h1>🧙 Admin Panel</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre"
    style="padding:10px;border-radius:8px;border:none;width:260px">
  <br><br>
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">
  <strong>API bağlı</strong>
  <button onclick="logout()">Çıkış</button>

  <table>
    <thead>
      <tr>
        <th>Durum</th>
        <th>Kayıt</th>
        <th>Ad Soyad</th>
        <th>Email</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const PASSWORD="cadimagic2025";
const API_URL="https://script.google.com/macros/s/AKfycbx7AiP3yKgNBUtY-25w7wldp_MUd5Q8JGsbRDJ4W8pxDAm13RIgvUrs53itOYchsRwe_Q/exec";

function login(){
  if(password.value===PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    loadData();
  }else{
    err.style.display="block";
  }
}

function logout(){ location.reload(); }

function nice(v){
  if(!v) return "";
  const d=new Date(v);
  return isNaN(d)?v:d.toLocaleString("tr-TR");
}

async function loadData(){
  try{
    const r=await fetch(API_URL);
    const data=await r.json();
    render(data);
  }catch{
    alert("API okunamadı");
  }
}

function render(rows){
  const el=document.getElementById("rows");
  el.innerHTML="";
  rows.slice(1).forEach(r=>{
    let c="yellow";
    if(r[9]==="Onaylandı") c="green";
    if(r[9]==="İptal") c="red";

    el.innerHTML+=`
      <tr>
        <td><span class="dot ${c}"></span></td>
        <td>${nice(r[0])}</td>
        <td>${r[1]||""}</td>
        <td>${r[2]||""}</td>
        <td>${r[3]||""}</td>
        <td>${nice(r[4])}</td>
        <td>${r[5]||""}</td>
        <td>${r[6]||""}</td>
        <td>${r[7]||""}</td>
        <td>${r[8]||""}</td>
      </tr>`;
  });
}
</script>

</body>
</html>
