<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  vertical-align:top;
}
.hidden{display:none}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş</button>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:12px">
    <input id="apiUrl" placeholder="Apps Script /exec URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
  </div>

  <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
  <button onclick="loadData('canli')">🎥 Canlı Ders</button>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
/* ================= CONFIG ================= */
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";
const rowsEl = document.getElementById("rows");

/* ================= HELPERS ================= */
function fmtDate(v){
  if(!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? v : d.toLocaleString("tr-TR");
}

function safe(v){
  return (v === undefined || v === null || v === "") ? "—" : v;
}

/* ================= AUTH ================= */
function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
  }
}

function logout(){
  location.reload();
}

function saveApi(){
  localStorage.setItem(LS_API, apiUrl.value.trim());
  alert("API kaydedildi");
}

/* ================= DATA ================= */
async function loadData(type){
  const url = localStorage.getItem(LS_API);
  if(!url){
    alert("API URL girilmedi");
    return;
  }

  const res = await fetch(url + "?type=" + type);
  const json = await res.json();

  rowsEl.innerHTML = "";

  (json.rows || []).forEach(r=>{
    const tr = document.createElement("tr");

    // 🔥 CADI ATÖLYESİ DAYANIKLI OKUMA
    const name  = r[1] || (r[2] ? r[2].split("@")[0] : "—");
    const phone = r[3] || "—";
    const date  = r[4] || "—";

    const cols = [
      fmtDate(r[0]),        // Kayıt Tarihi
      name,                // Ad Soyad
      safe(r[2]),           // E-posta
      phone,               // Telefon
      date,                // Tarih
      safe(r[5]),           // Seans
      safe(r[6]),           // Ücret
      safe(r[7]),           // Not
      safe(r[8] || "tr"),   // Dil
      safe(r[9] || "Beklemede") // Durum
    ];

    cols.forEach(c=>{
      const td = document.createElement("td");
      td.textContent = c;
      tr.appendChild(td);
    });

    rowsEl.appendChild(tr);
  });
}

/* ================= INIT ================= */
apiUrl.value = localStorage.getItem(LS_API) || "";
</script>

</body>
</html>
