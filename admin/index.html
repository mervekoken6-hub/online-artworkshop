<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
:root{
  --bg1:#0b1220;
  --bg2:#05060a;
  --card:rgba(12,18,32,.95);
  --a1:#6366f1;
  --ok:#34d399;
  --bad:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,var(--bg1),var(--bg2));
  color:#fff;
  min-height:100vh;
  padding:30px;
}
h1{margin-bottom:20px}
.card{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  max-width:1200px;
}
button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  background:var(--a1);
  color:#fff;
  font-weight:600;
  margin-right:6px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
  font-size:14px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
  text-align:left;
}
.hidden{display:none}
.status{margin-top:8px;font-size:13px}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <div class="status bad hidden" id="loginErr">Şifre yanlış</div>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script API URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <div class="status" id="apiStatus"></div>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">Cadı Atölyesi Kayıtları</button>
    <button onclick="loadData('canli')">Canlı Ders Kayıtları</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
