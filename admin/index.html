<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönetim Paneli • Workshop</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #334155; padding: 12px; text-align: left; font-size: 11px; text-transform: uppercase; color: #9ca3af; }
        td { padding: 12px; border-bottom: 1px solid #334155; font-size: 13px; white-space: nowrap; }
        
        .btn-action { cursor: pointer; border: none; border-radius: 6px; padding: 6px 10px; font-weight: bold; font-size: 11px; color: white; transition: 0.2s; }
        .btn-approve { background: #22c55e; margin-right: 4px; }
        .btn-reject { background: #ef4444; }
        .btn-nav { background: #6366f1; color: white; padding: 10px 20px; font-weight: 600; cursor: pointer; border-radius: 8px; border: none; }
        
        .badge-cnt { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid #475569; }
        .st-Onaylandı { color: #4ade80; font-weight: bold; }
        .st-Reddedildi { color: #f87171; font-weight: bold; }
        .st-Beklemede { color: #fbbf24; }
        
        .wa-link { color: #22c55e; text-decoration: none; font-weight: bold; font-size: 18px; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login" class="card" style="max-width:350px; margin: 80px auto; text-align:center;">
        <h2>Admin Girişi</h2>
        <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin-bottom:15px;">
        <button onclick="checkPass()" class="btn-nav" style="width:85%;">Giriş</button>
    </div>

    <div id="panel" class="hidden">
        <div class="card">
            <input id="url" placeholder="Apps Script URL" style="width:60%;">
            <button onclick="saveURL()" class="btn-nav">API Kaydet</button>
            <button onclick="location.reload()" class="btn-nav" style="background:#475569; float:right;">Çıkış</button>
        </div>

        <div style="text-align:center; margin-bottom:20px; display:flex; gap:10px; justify-content:center;">
            <button onclick="fetchData('cadi')" class="btn-nav" style="background:#7c3aed;">🧙 Cadı Atölyesi</button>
            <button onclick="fetchData('canli')" class="btn-nav" style="background:#db2777;">🎥 Canlı Ders</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>Telefon</th>
                        <th>Seans Tarihi</th>
                        <th>Kayıt Tarihi</th>
                        <th>E-Posta</th>
                        <th>Ücret</th>
                        <th>Not</th>
                        <th>Dil</th>
                        <th>Kontenjan</th>
                        <th>Durum</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
        let curType = "";
        function checkPass() {
            if(document.getElementById('pass').value === "cadimagic2025") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('panel').classList.remove('hidden');
                document.getElementById('url').value = localStorage.getItem('my_api') || "";
            }
        }
        function saveURL() {
            localStorage.setItem('my_api', document.getElementById('url').value.trim());
            alert("API Kaydedildi!");
        }

        async function update(rowIdx, status) {
            const api = localStorage.getItem('my_api');
            document.getElementById('status-'+rowIdx).innerText = "⏳...";
            const res = await callAPI(api, { action: "update", type: curType, rowIndex: rowIdx, status: status });
            if(res.ok) fetchData(curType);
        }

        async function fetchData(type) {
            curType = type;
            const api = localStorage.getItem('my_api');
            const list = document.getElementById('list');
            list.innerHTML = "<tr><td colspan='11' style='text-align:center;'>Yükleniyor...</td></tr>";
            
            const res = await callAPI(api, { type: type });
            list.innerHTML = "";

            // Kontenjan Analizi
            const counts = {};
            res.rows.forEach(r => {
                if(r[9] === "Onaylandı") {
                    const key = String(r[4]).split('T')[0] + "_" + String(r[5]);
                    counts[key] = (counts[key] || 0) + 1;
                }
            });

            const rowsData = [...res.rows];
            rowsData.reverse().forEach((r, revIdx) => {
                const realIdx = rowsData.length - 1 - revIdx;
                const dKey = String(r[4]).split('T')[0] + "_" + String(r[5]);
                const c = counts[dKey] || 0;
                const status = r[9] || "Beklemede";

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold">${r[1] || '—'}</td>
                    <td>${r[3] || '—'}</td>
                    <td>${String(r[4]).split('T')[0]}<br><small>${r[5]}</small></td>
                    <td style="color:#9ca3af; font-size:11px">${r[0] ? new Date(r[0]).toLocaleString('tr-TR') : '—'}</td>
                    <td>${r[2] || '—'}</td>
                    <td>${r[6] || '0'} TL</td>
                    <td style="max-width:150px; overflow:hidden; text-overflow:ellipsis;" title="${r[7]}">${r[7] || '—'}</td>
                    <td><span class="badge-cnt">${r[8] || 'tr'}</span></td>
                    <td>
                        <span class="badge-cnt" style="border-color:${c >= 5 ? '#ef4444' : '#22c55e'}">${c} / 5</span>
                    </td>
                    <td id="status-${realIdx}" class="st-${status}">${status}</td>
                    <td>
                        <button class="btn-action btn-approve" onclick="update(${realIdx}, 'Onaylandı')">Onayla</button>
                        <button class="btn-action btn-reject" onclick="update(${realIdx}, 'Reddedildi')">Reddet</button>
                        <a href="https://wa.me/${String(r[3]).replace(/\D/g,'')}" target="_blank" class="wa-link"> 📲</a>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function callAPI(url, params) {
            return new Promise(resolve => {
                const cb = "cb" + Math.floor(Math.random()*1000000);
                const s = document.createElement('script');
                const q = new URLSearchParams(params).toString();
                window[cb] = d => { s.remove(); resolve(d); };
                s.src = `${url}?${q}&callback=${cb}`;
                document.body.appendChild(s);
            });
        }
    </script>
</body>
</html>
