<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1100px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
}
.hidden{display:none}
</style>
</head>

<body>

<h1>🧙 Admin Panel • Online Art Workshop</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:12px">
    <input id="apiUrl" placeholder="Apps Script API URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status"></span>
  </div>

  <button onclick="loadData()">Canlı Ders Kayıtları</button>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";

function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
  }else{
    err.style.display="block";
  }
}

function logout(){
  location.reload();
}

function saveApi(){
  localStorage.setItem("api", apiUrl.value);
  status.textContent="Kaydedildi";
}

async function loadData(){
  const url = localStorage.getItem("api");
  if(!url) return alert("API yok");

  const res = await fetch(url);
  const json = await res.json();

  rows.innerHTML="";
  json.rows.forEach(r=>{
    const tr=document.createElement("tr");
    [r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[9]].forEach(c=>{
      const td=document.createElement("td");
      td.textContent=c||"";
      tr.appendChild(td);
    });
    rows.appendChild(tr);
  });
}

apiUrl.value = localStorage.getItem("api") || "";
</script>

</body>
</html>
