<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Admin Panel • Online Art Workshop</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:#fff;
  padding:30px;
}
.card{
  background:#111827;
  padding:20px;
  border-radius:14px;
  max-width:1200px;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:420px;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#6366f1;
  color:#fff;
  cursor:pointer;
  margin-right:6px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:18px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #333;
}
.hidden{display:none}
.status{margin-left:10px;font-size:13px}
.bad{color:#fb7185}
.ok{color:#34d399}
</style>
</head>

<body>

<h1>🧙 Admin Panel</h1>

<div class="card" id="loginCard">
  <h3>Giriş</h3>
  <input type="password" id="password" placeholder="Şifre">
  <button onclick="login()">Giriş Yap</button>
  <p id="err" style="color:#fb7185;display:none">Şifre yanlış</p>
</div>

<div class="card hidden" id="panelCard">

  <div style="margin-bottom:14px">
    <input id="apiUrl" placeholder="Apps Script Web App URL">
    <button onclick="saveApi()">Kaydet</button>
    <button onclick="logout()">Çıkış</button>
    <span id="status" class="status"></span>
  </div>

  <div style="margin-bottom:10px">
    <button onclick="loadData('cadi')">🧙 Cadı Atölyesi</button>
    <button onclick="loadData('canli')">🎥 Canlı Ders</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Kayıt Tarihi</th>
        <th>Ad Soyad</th>
        <th>E-posta</th>
        <th>Telefon</th>
        <th>Tarih</th>
        <th>Seans</th>
        <th>Ücret</th>
        <th>Not</th>
        <th>Dil</th>
        <th>Durum</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

</div>

<script>
const PASSWORD = "cadimagic2025";
const LS_API = "admin_api_url";

// Giriş / çıkış
function login(){
  if(password.value === PASSWORD){
    loginCard.classList.add("hidden");
    panelCard.classList.remove("hidden");
    err.style.display="none";
  }else{
    err.style.display="block";
  }
}
function logout(){ location.reload(); }

// API URL kaydet
function saveApi(){
  localStorage.setItem(LS_API, apiUrl.value.trim());
  status.textContent="✅ API kaydedildi";
  status.className="status ok";
}

// Metin formatlama
function fmt(v){
  if(typeof v === "string" && v.includes("T") && v.endsWith("Z")){
    const d = new Date(v);
    if(!isNaN(d)) return d.toLocaleString("tr-TR");
  }
  return (v ?? "").toString();
}

// Veri çekme
async function loadData(type){
  const url = localStorage.getItem(LS_API);
  if(!url){
    status.textContent="❌ API URL girilmedi";
    status.className="status bad";
    return;
  }

  status.textContent="⏳ Yükleniyor...";
  try{
    const res = await fetch(url + "?type=" + type);
    const json = await res.json();
    if(!json.ok) throw json.error;

    renderRows(json.rows || []);
    status.textContent="✅ Yüklendi (" + (json.rows ? json.rows.length : 0) + ")";
    status.className="status ok";
  }catch(err){
    status.textContent="❌ Veri alınamadı";
    status.className="status bad";
  }
}

// Satır gösterimi
function renderRows(rows){
  const el = document.getElementById("rows");
  el.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${fmt(r.kayitTarihi)}</td>
      <td>${fmt(r.adSoyad)}</td>
      <td>${fmt(r.email)}</td>
      <td>${fmt(r.telefon)}</td>
      <td>${fmt(r.tarih)}</td>
      <td>${fmt(r.seans)}</td>
      <td>${fmt(r.ucret)}</td>
      <td>${fmt(r.not)}</td>
      <td>${fmt(r.dil)}</td>
      <td>${fmt(r.durum)}</td>
    `;

    el.appendChild(tr);
  });
}

// Kaydedilmiş API’yi getir
apiUrl.value = localStorage.getItem(LS_API) || "";
</script>

</body>
</html>
